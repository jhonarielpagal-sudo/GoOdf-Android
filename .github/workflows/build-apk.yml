name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here so the repo only needs lib/,
      # test/, pubspec.yaml and this workflow.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name goodf_mobile --org org.goodf .
          fi
          # flutter create adds a sample test that refers to a MyApp class we don't have.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Tests are informational: a failing test is shown but does not stop the APK build.
      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk goodf-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goodf-mobile-apk
          path: goodf-mobile.apk

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: goodf-mobile.apk
